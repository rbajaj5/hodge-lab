<div id="graded-map-patterns">
  <h2>Bands, factors, and basis choice</h2>
  <div class="viz-controls">
    <label class="form-label">X1/Y1 case<select class="form-select" data-family></select></label>
    <label class="form-label">Total degree<select class="form-select" data-degree><option value="3">3</option><option value="4">4</option></select></label>
    <label class="form-label">Basis<select class="form-select" data-basis><option value="raw">Original</option><option value="adapted">Factor-adapted</option><option value="permuted">Reordered original</option></select></label>
    <label class="form-label">Color<select class="form-select" data-color><option value="green">Signs · green/purple</option><option value="blue">Signs · blue/orange</option><option value="strength">Strength · blue/orange</option></select></label>
  </div>
  <div class="tabular-nums" data-rank aria-live="polite"></div>
  <svg class="matrix-chart" role="img" aria-label="Exact coefficient matrix of a graded multiplication map"></svg>
  <div class="viz-row text-small"><span>Coefficient sign:</span><span><b class="positive">+</b> positive</span><span><b class="negative">−</b> negative</span><span>blank = zero</span><span data-color-key></span></div>
  <div class="text-small tabular-nums" data-detail aria-live="polite"></div>
  <div class="text-small" data-route></div>
  <div class="tooltip" role="tooltip" data-tip hidden></div>
</div>
<style>
#graded-map-patterns {position:relative;}
#graded-map-patterns .matrix-chart {display:block;width:100%;}
#graded-map-patterns .matrix-chart text {fill:var(--foreground);font-size:12px;}
#graded-map-patterns .matrix-chart .domain,#graded-map-patterns .matrix-chart .tick line {stroke:var(--border);}
#graded-map-patterns .positive {color:var(--viz-series-1);}
#graded-map-patterns .negative {color:var(--viz-series-2);}
#graded-map-patterns [data-tip] {position:absolute;pointer-events:none;background:var(--popover);color:var(--popover-foreground);max-width:220px;overflow-wrap:anywhere;}
</style>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(()=>{
 const data=__DATA__,root=document.getElementById('graded-map-patterns'),svg=d3.select(root.querySelector('svg'));
 const family=root.querySelector('[data-family]'),degree=root.querySelector('[data-degree]'),tip=root.querySelector('[data-tip]');
 const basis=root.querySelector('[data-basis]'),color=root.querySelector('[data-color]');
 let state={family:19,degree:4,basis:'raw',color:'green'};
 family.replaceChildren(...data.cases.map(c=>{const o=document.createElement('option');o.value=c.batch_number;o.textContent=c.batch_number+' · ('+c.third_character.join(', ')+')';return o;}));
 const select=()=>{const c=data.cases.find(c=>c.batch_number===Number(state.family))||data.cases[0];state.family=c.batch_number;state.degree=Number(state.degree)===3?3:4;state.basis=['raw','adapted','permuted'].includes(state.basis)?state.basis:'raw';state.color=['green','blue','strength'].includes(state.color)?state.color:'green';return {c,m:c.maps.find(m=>m.degree===state.degree)[state.basis]};};
 function draw(){
  const {c,m}=select();family.value=state.family;degree.value=state.degree;basis.value=state.basis;color.value=state.color;tip.hidden=true;
  const positive=state.color==='green'?'var(--green)':'var(--viz-series-1)',negative=state.color==='green'?'var(--purple)':'var(--viz-series-2)';
  root.querySelector('.positive').style.color=positive;root.querySelector('.negative').style.color=negative;
  const value=s=>{const a=s.split('/');return Number(a[0])/(Number(a[1])||1);},maximum={};
  for(const c of m.cells)maximum[c.column]=Math.max(maximum[c.column]||0,Math.abs(value(c.exact)));
  root.querySelector('[data-color-key]').textContent=state.color==='strength'?'Opacity: relative magnitude within each column':'';
  const w=root.getBoundingClientRect().width,h=380,left=68,right=18,top=20,bottom=h-68;
  svg.attr('viewBox',`0 0 ${w} ${h}`).attr('height',h);svg.selectAll('*').remove();
  svg.append('title').text('Family '+c.batch_number+': rank '+m.rank+', kernel '+m.kernel);
  const cols=Math.max(1,m.domain),x=d3.scaleLinear().domain([0,cols]).range([left,w-right]),y=d3.scaleLinear().domain([0,m.codomain]).range([top,bottom]);
  svg.append('rect').attr('data-chart-frame','').attr('x',left).attr('y',top).attr('width',w-left-right).attr('height',bottom-top).attr('fill','none').attr('stroke','var(--border)');
  const ticks=(n,max)=>Array.from(new Set(d3.range(Math.min(n,max)).map(i=>Math.round(i*(n-1)/Math.max(1,Math.min(n,max)-1)))));
  if(m.domain)svg.append('g').attr('transform',`translate(0,${bottom})`).call(d3.axisBottom(x).tickValues(ticks(m.domain,w<400?3:5).map(i=>i+.5)).tickFormat(v=>String(v-.5)));
  svg.append('g').attr('transform',`translate(${left},0)`).call(d3.axisLeft(y).tickValues(ticks(m.codomain,5).map(i=>i+.5)).tickFormat(v=>String(v-.5)));
  svg.selectAll('rect.entry').data(m.cells).join('rect').attr('class','entry')
   .attr('x',d=>x(d.column)+.4).attr('y',d=>y(d.row)+.4).attr('width',Math.max(.2,x(1)-x(0)-.8)).attr('height',Math.max(.2,y(1)-y(0)-.8))
   .attr('fill',d=>d.exact.startsWith('-')?negative:positive).attr('opacity',d=>state.color==='strength'?.2+.8*Math.abs(value(d.exact))/maximum[d.column]:1);
  svg.append('text').attr('class','axis-title').attr('data-axis','x').attr('x',(left+w-right)/2).attr('y',h-18).attr('text-anchor','middle').text('Equation × monomial column');
  svg.append('text').attr('class','axis-title').attr('data-axis','y').attr('transform',`translate(17,${(top+bottom)/2}) rotate(-90)`).attr('text-anchor','middle').text('Output monomial row');
  if(!m.domain)svg.append('text').attr('x',(left+w-right)/2).attr('y',(top+bottom)/2).attr('text-anchor','middle').text('No generators');
  function inspect(event){
   if(!m.domain)return;
   const point=d3.pointer(event,svg.node()),col=Math.min(m.domain-1,Math.max(0,Math.floor(x.invert(point[0])))),row=Math.min(m.codomain-1,Math.max(0,Math.floor(y.invert(point[1]))));
   const exact=m.cells.find(d=>d.column===col&&d.row===row)?.exact||'0';
   const text=m.columns[col]+' → '+m.rows[row]+' : '+exact;
   tip.textContent=text;tip.hidden=false;const box=root.getBoundingClientRect();
   tip.style.left=Math.max(0,Math.min(w-220,event.clientX-box.left+12))+'px';tip.style.top=(event.clientY-box.top+12)+'px';root.querySelector('[data-detail]').textContent=text;
  }
  svg.append('rect').attr('data-chart-hit','').attr('x',left).attr('y',top).attr('width',w-left-right).attr('height',bottom-top).attr('fill','transparent').on('pointermove',inspect).on('click',inspect).on('pointerleave',()=>tip.hidden=true);
  root.querySelector('[data-rank]').textContent=m.domain+' → '+m.codomain+' monomials · exact rank '+m.rank+' · kernel '+m.kernel;
  root.querySelector('[data-detail]').textContent='Adapted generators: '+c.generators.join(' · ');
  root.querySelector('[data-route]').textContent=c.geometry;
  const labels=[...svg.node().querySelectorAll('text')];for(const el of labels){const b=el.getBoundingClientRect(),r=root.getBoundingClientRect();if((b.left<r.left||b.right>r.right)&&el.closest('.tick'))el.remove();}
 }
 for(const [key,el] of [['family',family],['degree',degree],['basis',basis],['color',color]])el.addEventListener('change',()=>{state[key]=['family','degree'].includes(key)?Number(el.value):el.value;draw();window.openai?.setWidgetState?.({modelContent:{...state},privateContent:null})?.catch(()=>{});});
 window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.modelContent;if(s){state={...state,...s};draw();}});
 if(window.openai?.widgetState?.modelContent)state={...state,...window.openai.widgetState.modelContent};
 root.mapSnapshot=()=>{const {c,m}=select();return {...state,rank:m.rank,domain:m.domain,codomain:m.codomain,entries:m.cells.length,forced:m.forced_coordinates};};
 let width=0;new ResizeObserver(entries=>{const w=entries[0].contentRect.width;if(w!==width){width=w;draw();}}).observe(root);draw();
})();
</script>
