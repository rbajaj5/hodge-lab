name: Notebook Lean proofs

on:
  push:
    paths:
      - 'formal/**'
      - 'results/cyclic-fano-lean/**'
      - '.github/workflows/lean.yml'
      - 'scripts/check_skew_physical_source.py'
  pull_request:
    paths:
      - 'formal/**'
      - 'results/cyclic-fano-lean/**'
      - '.github/workflows/lean.yml'
      - 'scripts/check_skew_physical_source.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rank-gap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Elan bootstrap
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/v4.2.0/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned mathlib cache
        working-directory: formal
        run: lake exe cache get
      - name: Compile, audit axioms, and replay kernel
        working-directory: formal
        run: python3 check.py
      - name: Check concrete coefficient obstructions
        working-directory: formal
        run: python3 check_concrete.py
      - name: Check the skew polynomial obstruction
        working-directory: formal
        run: python3 -O check_skew.py
      - name: Check arbitrary degree-four inputs and the mixed-polar comparison
        working-directory: formal
        run: python3 -O check_skew_extension.py
      - name: Check the protected sextic to chart substitution
        working-directory: formal
        run: python3 -O check_skew_chart.py
      - name: Check ordered coordinate volume and chart assumptions
        working-directory: formal
        run: python3 -O check_skew_volume.py
      - name: Check local residue normalization and normal chart
        working-directory: formal
        run: python3 -O check_skew_residue.py
      - name: Check the constructed ambient coordinate derivation
        working-directory: formal
        run: python3 -O check_skew_ambient.py
      - name: Check immutable and fresh receipt separation
        working-directory: formal
        run: timeout 60 python3 -O test_receipt_lifecycle.py
      - name: Check the actual differential-form reduction
        working-directory: formal
        run: python3 -O check_skew_forms.py --output-dir results/runs/ci-skew-forms
      - name: Check the split trace-free basis and normalization
        working-directory: formal
        run: python3 -O check_skew_trace_basis.py --output-dir results/runs/ci-skew-trace-basis
      - name: Bind the literal physical cover to pinned sources
        working-directory: formal
        run: timeout 60 python3 -O ../scripts/check_skew_physical_source.py --output-dir results/runs/ci-skew-physical-source
      - name: Check the conditional physical-cover lemma
        working-directory: formal
        run: python3 -O check_skew_physical_cover.py --output-dir results/runs/ci-skew-physical-cover
      - name: Check generic distinct roots in the physical splitting field
        working-directory: formal
        run: python3 -O check_skew_distinct_roots.py --output-dir results/runs/ci-skew-distinct-roots
      - name: Check scalar-extension isomorphism and quotient traces
        working-directory: formal
        run: timeout 600 python3 -O check_skew_scalar_extension.py --output-dir results/runs/ci-skew-scalar-extension
      - name: Check physical-source normalization and selected fibre correction
        working-directory: formal
        run: timeout 600 python3 -O check_skew_physical_source_normalization.py --output-dir results/runs/ci-skew-source-normalization
      - name: Check physical curve and allowed differential pullbacks
        working-directory: formal
        run: timeout 600 python3 -O check_skew_physical_curve.py --output-dir results/runs/ci-skew-physical-curve
      - name: Save concrete proof receipts and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: concrete-lean-verification
          path: |
            formal/results/concrete-coefficient-validation.json
            formal/results/concrete/*.json
            formal/results/concrete/*.log
            formal/results/skew-lean/*.json
            formal/results/skew-lean/*.log
            formal/results/skew-extension/*.json
            formal/results/skew-extension/*.log
            formal/results/skew-chart/*.json
            formal/results/skew-chart/*.log
            formal/results/skew-volume/*.json
            formal/results/skew-volume/*.log
            formal/results/skew-residue/*.json
            formal/results/skew-residue/*.log
            formal/results/skew-ambient/*.json
            formal/results/skew-ambient/*.log
            formal/results/runs/**
          if-no-files-found: error
