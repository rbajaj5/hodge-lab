name: Polynomial to matrix Lean bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  case05-polynomial-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Elan bootstrap
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/v4.2.0/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reconstruct polynomial bridge independently
        run: python3 -S experiments/check_cyclic_fano_polynomial_bridge.py
      - name: Compile, audit and replay the polynomial bridge
        working-directory: formal
        run: python3 -S check_polynomial_bridge.py --fetch-cache
      - name: Preserve actual receipts and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: polynomial-bridge-verification
          path: |
            formal/results/polynomial-bridge-check/
            results/cyclic-fano-polynomial-bridge/independent-validation.json
          if-no-files-found: error
