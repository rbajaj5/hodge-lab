name: CPU checks and certificate replay
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cyclic-fano-unfolding-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "sympy>=1.13,<2" "matplotlib>=3.9,<4"
      - run: |
          for axis in X0 Y0 Y2; do
            python experiments/cyclic_fano_unfolding.py verify --axis "$axis"
          done
      - run: python experiments/cyclic_fano_unfolding.py summary
      - run: python -S experiments/check_cyclic_fano_unfolding.py
      - run: python experiments/plot_cyclic_fano_unfolding.py
      - run: python -S experiments/cyclic_fano_transfer.py verify
      - run: python -S experiments/check_cyclic_fano_transfer.py
      - run: python experiments/plot_cyclic_fano_transfer.py
  quadric-contact-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "matplotlib>=3.9,<4"
      - run: python -S experiments/quadric_contact_pilot.py verify
      - run: python -S experiments/check_quadric_contact_pilot.py
      - run: python experiments/plot_quadric_contact_pilot.py
  cyclic-fano-continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "sympy>=1.13,<2" "matplotlib>=3.9,<4" "python-flint>=0.9,<1"
      - run: python experiments/cyclic_fano_fibers.py verify
      - run: python -S experiments/cyclic_fano_fibers.py verify-macaulay
      - run: python experiments/check_cyclic_fano_fibers.py work/cyclic-fiber-independent.json
      - run: python experiments/check_cyclic_fano_ramification.py
      - run: python experiments/plot_cyclic_fano_ramification.py
      - run: python experiments/cyclic_fano_spectrum.py verify
      - run: python -S experiments/check_cyclic_fano_spectrum.py
      - run: python experiments/plot_cyclic_fano_spectrum.py
  cyclic-fano-curve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "sympy>=1.13,<2" "matplotlib>=3.9,<4"
      - run: python experiments/cyclic_fano_curve.py verify
      - run: python experiments/check_cyclic_fano_curve.py work/cyclic-fano-independent.json
      - run: python experiments/plot_cyclic_fano_curve.py
  mixed-degree6-extra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "sympy>=1.13,<2" "matplotlib>=3.9,<4"
      - run: python -S experiments/mixed_degree6_extra.py verify-all
      - run: python -S experiments/mixed_degree6_quadratic_field.py verify
      - run: python experiments/check_mixed_degree6_extra.py . work/mixed-degree6-independent.json
      - run: python experiments/plot_mixed_degree6_extra.py
  fresh-instance-degree6:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "sympy>=1.13,<2" "matplotlib>=3.9,<4"
      - run: python -S experiments/fresh_instance_degree6.py verify-all
      - run: python experiments/check_fresh_instance_degree6_independent.py . work/fresh-degree6-independent.json
      - run: python experiments/plot_fresh_instance_degree6.py
  fresh-instance-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "sympy>=1.13,<2" "matplotlib>=3.9,<4"
      - run: python -S experiments/fresh_instance_e1.py verify
      - run: python experiments/check_fresh_instance_e1_independent.py . 5 work/fresh-independent.json
      - run: python experiments/plot_fresh_instance_e1.py
  typed-rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -S experiments/check_typed_rewrite_families.py --follow
      - run: python -S experiments/check_typed_rewrite_families.py --follow --independent
      - run: python -S experiments/typed100_continuation.py --check
      - run: python -S experiments/typed100_continuation.py --check --independent
      - run: python -S experiments/typed100_continuation.py --check-blocks
      - run: python -S experiments/typed100_continuation.py --check-blocks --independent
      - run: python -S experiments/typed100_continuation.py --check-closure
      - run: python -S experiments/typed100_continuation.py --check-closure --independent
      - run: python -S experiments/t100_rebuilt_multipliers.py --check
      - run: python -S experiments/t100_rebuilt_multipliers.py --check --independent
      - run: python -S experiments/t100_rebuilt_blocks.py --check
      - run: python -S experiments/t100_rebuilt_blocks.py --check --independent
      - run: python -S experiments/t100_rebuilt_closure.py --check
      - run: python -S experiments/t100_rebuilt_closure.py --check --independent
      - run: python -S experiments/plot_t100_rebuilt.py --check
      - run: python -S experiments/typed_rewrite_search.py --check
      - run: python -S experiments/typed_rewrite_search.py --check --independent
      - run: python -S experiments/typed_goal_powers.py --check
      - run: python -S experiments/typed_goal_powers.py --check --independent
      - run: python -S experiments/typed_goal_quartics.py --check
      - run: python -S experiments/typed_goal_quartics.py --check --independent
      - run: python -S experiments/plot_typed_rewrite.py --check
  added-character-homology:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -S experiments/check_added_character_homology.py
      - run: python -S experiments/check_added_character_homology.py --independent
      - run: python -S experiments/plot_added_character_homology.py --check
      - run: python -S experiments/added100_multipliers.py --check
      - run: python -S experiments/added100_multipliers.py --check --independent
      - run: python -S experiments/added100_multipliers.py --check-blocks
      - run: python -S experiments/added100_multipliers.py --check-blocks --independent
      - run: python -S experiments/added100_multipliers.py --check-closure
      - run: python -S experiments/added100_multipliers.py --check-closure --independent
      - run: python -S experiments/plot_added100_continuation.py --check
  homology-guided-triples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -S experiments/check_homology_guided_triples.py
      - run: python -S experiments/check_homology_guided_triples.py --independent
      - run: python -S experiments/plot_homology_guided_triples.py --check
  necessary-koszul-complex:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -S experiments/necessary_koszul_complex.py --check
  y0x1-extensions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -S experiments/check_y0x1_extensions.py
      - run: python -S experiments/check_y0x1_extensions.py --independent
      - run: python -S experiments/y100_multipliers.py --check
      - run: python -S experiments/y100_multipliers.py --check --independent
      - run: python -S experiments/y100_multipliers.py --blocks --check
      - run: python -S experiments/y100_after_powers.py --check
      - run: python -S experiments/y100_after_powers.py --check --independent
      - run: python -S experiments/plot_y0x1_extensions.py --check
      - run: python -S experiments/graded_map_patterns.py --check
  x1y1-extensions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -S experiments/reproduce_pair30.py --fetch --output-directory results/x1y1-extensions/pair30
      - run: python -S experiments/check_x1y1_extensions.py
      - run: python -S experiments/check_x1y1_extensions.py --independent
      - run: python -S experiments/check_x1y1_shared.py
      - run: python -S experiments/check_x1y1_shared.py --independent
      - run: python -S experiments/plot_x1y1_extensions.py --check
  family151-multipliers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -S experiments/check_family151_multipliers.py
      - run: python -S experiments/check_family151_multipliers.py --independent
      - run: python -S experiments/family151_cubic_blocks.py --check
      - run: python -S experiments/family151_cubic_blocks.py --check --independent
      - run: python -S experiments/check_family151_multipliers.py --follow
      - run: python -S experiments/check_family151_multipliers.py --follow --independent
      - run: python -S experiments/plot_family151_multipliers.py --check
  remaining-triples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -S experiments/reproduce_pair30.py --fetch --output-directory results/remaining-triples-shared/pair30
      - run: python -S experiments/check_remaining_triples.py
      - run: python -S experiments/check_remaining_triples.py --independent
      - run: python -S experiments/plot_remaining_triples.py --check
  eleven-quartic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -S experiments/eleven_quartic.py --check-blocks
      - run: python -S experiments/reproduce_pair30.py --fetch --output-directory results/eleven-quartic/pair30
      - run: python -S experiments/check_eleven_quartic.py
      - run: python -S experiments/check_eleven_quartic.py --independent
      - run: python -S experiments/plot_eleven_quartic.py --check
  eisenbud-quartic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -S experiments/quartic_pure_blocks.py --check
      - run: python -S experiments/check_quartic_exclusions.py
      - run: python -S experiments/check_quartic_exclusions.py --independent
      - run: |
          for family in 6 8 10 149 152; do
            python -S experiments/eisenbud_quartic_strand.py --family "$family" --check
          done
      - run: python -S experiments/quartic_auxiliary.py
      - run: python -S experiments/plot_quartic_strand.py --check
  eisenbud-strand:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -S experiments/eisenbud_linear_strand.py --check
      - run: python -S experiments/eisenbud_linear_strand.py --check --independent
      - run: python -S experiments/plot_eisenbud_strand.py --check
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python experiments/plot_koszul_continuation.py --check
      - run: python -S experiments/optimize_koszul_parameters.py --check
      - run: python experiments/optimize_koszul_parameters.py --check --independent --numerics
      - run: python experiments/plot_parameter_optimization.py --check
      - run: python experiments/build_search_explorer.py --check
      - run: python experiments/build_koszul_geometry.py --check
      - run: python experiments/plot_koszul_geometry.py --check
      - run: python experiments/check_transfer_packet.py
      - run: python algebra/degree6_verify_all_coefficients.py
      - run: python algebra/fixed_denominator_search.py --check
      - run: python experiments/denominator_gram_search.py --check
      - run: python algebra/degree7_e1.py --check
      - run: python algebra/degree7_verify_polynomials.py
      - run: python algebra/degree7_character_search.py --check
      - run: python -S algebra/degree7_y0_x1.py --check
      - run: python -S algebra/degree7_x0_y0.py --check
      - run: python -S experiments/dubedat_cycle_search.py --check
      - run: python -S experiments/hodge_projected_search.py --check
      - run: python -S experiments/check_hodge_projected_search.py
      - run: python experiments/check_high_genus_flow.py
      - run: python -S algebra/degree7_triples.py --check
      - run: python -S algebra/check_degree7_triples.py
      - run: python -S algebra/degree7_triple_shared.py --check
      - run: python -S algebra/degree7_triple_shared.py --check --independent
      - run: python -S algebra/degree7_syzygies.py --check
      - run: python -S algebra/degree7_syzygies.py --check --independent
      - run: python -S algebra/degree7_syzygy_rebuild.py --check
      - run: python -S algebra/degree7_syzygy_rebuild.py --check --independent
      - run: python -S algebra/check_family16_global_cubes.py
  koszul-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python experiments/sweep_koszul_map.py --check
      - run: python -S experiments/search_koszul_interior.py --check
      - run: python experiments/plot_koszul_sweep.py --check
  koszul-continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -S algebra/degree7_rank_strata.py --check-all
      - run: python -S algebra/degree7_rank_strata.py --check-all --independent
      - run: python -S algebra/degree7_koszul_continuation.py
      - run: python -S algebra/degree7_koszul_continuation.py --independent
