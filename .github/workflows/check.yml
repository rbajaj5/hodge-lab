name: CPU checks and certificate replay
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python experiments/check_transfer_packet.py
      - run: python algebra/degree6_verify_all_coefficients.py
      - run: python algebra/fixed_denominator_search.py --check
      - run: python experiments/denominator_gram_search.py --check
      - run: python algebra/degree7_e1.py --check
      - run: python algebra/degree7_verify_polynomials.py
      - run: python algebra/degree7_character_search.py --check
      - run: python -S algebra/degree7_y0_x1.py --check
      - run: python -S algebra/degree7_x0_y0.py --check
      - run: python -S experiments/dubedat_cycle_search.py --check
      - run: python -S experiments/hodge_projected_search.py --check
      - run: python -S experiments/check_hodge_projected_search.py
      - run: python experiments/check_high_genus_flow.py
      - run: python -S algebra/degree7_triples.py --check
      - run: python -S algebra/check_degree7_triples.py
      - run: python -S algebra/degree7_triple_shared.py --check
      - run: python -S algebra/degree7_triple_shared.py --check --independent
